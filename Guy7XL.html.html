  .badge{font-family:"Rubik",sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;

  .badge.hard{color:#8A5600;border-color:#D69A2A;background:rgba(214,154,42,.18)}

  /* ---- today rows ---- */

  /* ---- controls ---- */
  button{font-family:inherit;font-size:15px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .b-gold{background:linear-gradient(#E6BC5E,var(--gold));border-color:var(--gold-dim);color:#2A2008;font-weight:700}
  .b-out{background:transparent;border-color:var(--moss);color:var(--moss);font-weight:600}
  .icon{width:33px;height:33px;padding:0;font-family:"Rubik",sans-serif;font-weight:700;flex:none;border-radius:99px}

  .add{display:flex;gap:8px;margin-bottom:11px}
  .add input{flex:1;min-width:0;border:1px solid rgba(214,169,74,.45);border-radius:99px;padding:9px 14px;
    font-family:inherit;font-size:16px;background:rgba(0,0,0,.22);color:var(--cream)}
  .add input::placeholder{color:rgba(240,234,218,.5)}
  .u-head{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .u-name{border:0;background:transparent;font-family:inherit;font-weight:700;font-size:17px;color:var(--ink);flex:1;min-width:0;padding:2px}
  .u-name:focus{border-bottom:1px solid var(--moss);outline:none}
  .u-task{font-size:14px;color:var(--soft);margin:0 0 10px}
  .u-act{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .spacer{flex:1}

  .fin{font-size:12.5px;font-weight:700;color:var(--gold-dim)}
  .dayin{width:56px;text-align:center;font-family:"Rubik",sans-serif;font-weight:700;font-size:15px;
    border:1px solid var(--line);border-radius:99px;padding:6px 4px;background:#fff;color:var(--ink);
    font-variant-numeric:tabular-nums;-moz-appearance:textfield}
  .dayin::-webkit-outer-spin-button,.dayin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .m-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}

    border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;color:var(--ink);
    font-variant-numeric:tabular-nums}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div class="wrap" id="app"><p style="padding:32px 0">טוען...</p></div>

<script>
/* ============ config ============ */
const KEY = 'thirty-day-tracker-v2';
const TOTAL = 30;
const DAY_START_HOUR = 3;               /* המשימה מתחלפת ב-03:00 */
const SUITS = ['\u2660','\u2665','\u2666','\u2663'];
const CHIPS = ['#B02A2A','#1E4FA3','#1F7A46','#2B2B2B','#EFE9DC','#6B3FA0','#C2701C','#127B85'];

const DEFAULT_TASKS = [
  "50 Holdem hands",
  "100 Holdem hands",
  "50 Omaha hands",
  "70 All in or Fold hands",
  "10 Spin & Gold",
  "50 Short Deck hands",
  "100 Rush & Cash hands",
  "5x multiplier Spin & Gold",
  "Spin & Gold x3",
  "AA in All in or Fold",
  "Bounty Hunter tournament (about 5 hours)",
  "30 Spin & Gold",
  "Daily Guarantee tournament",
  "Holdem - win a hand with a full house",
  "100 Short Deck hands",
  "200 Rush & Cash hands",
  "Win with a flush in All in or Fold",
  "Full house in All in or Fold",
  "300 All in or Fold hands",
  "500 Rush & Cash hands",
  "300 Holdem hands",
  "50 Spin & Gold",
  "Quads in PLO (Omaha)",
  "300 PLO hands (Omaha)",
  "500 All in or Fold hands",
  "Win a Bounty Hunter tournament",
  "500 Rush & Cash hands",
  "10x Spin & Gold",
  "700 Rush & Cash hands",
  "Win an All in or Fold jackpot"
];
const DEFAULT_NAMES = ['7','8','9','10','11'];
const DEFAULT_FLAGS = {10:'hard',17:'hard',19:'hard',18:'no',23:'no',25:'no',26:'no',30:'no'};
const FLAG_TEXT = {hard:'Hard', no:'Do Not Do'};

/* ============ helpers ============ */
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
/* היום הנוכחי במשחק: כל מה שקורה לפני 03:00 נחשב ליום הקודם */
const gameDay = () => fmt(new Date(Date.now() - DAY_START_HOUR*3600*1000));
const gameDayDate = () => new Date(Date.now() - DAY_START_HOUR*3600*1000);
function msToSwitch(){
  const now = new Date(), nxt = new Date(now);
  nxt.setHours(DAY_START_HOUR,0,0,0);
  if (now >= nxt) nxt.setDate(nxt.getDate()+1);
  return nxt - now;
}
const suitOf = d => SUITS[(d-1)%4];
const isRed = d => (d-1)%4===1 || (d-1)%4===2;
const taskName = d => (state.tasks[d-1]||'').trim() || ('משימה '+d);
const flagOf = d => (state.flags||{})[d] || '';
function badge(d, editable){
  const f = flagOf(d);
  if (editable) return '<button class="badge '+(f||'off')+'" data-act="flag" data-day="'+d+'" title="החלפת תגית">'+(f?FLAG_TEXT[f]:'תגית')+'</button>';
  return f ? '<span class="badge '+f+'">'+FLAG_TEXT[f]+'</span>' : '';
}
const doneToday = u => u.doneDate === gameDay() && u.doneDay === u.day;
const finished = u => u.day > TOTAL;
const chipOf = u => { const i = state.users.findIndex(x=>x.id===u.id); return CHIPS[(i<0?0:i)%CHIPS.length]; };
const pale = hex => hex === '#EFE9DC';
function token(u, extra){
  const c = chipOf(u);
  return '<span class="tok'+(pale(c)?' pale':'')+(extra||'')+'" style="background:'+c+'" title="'+esc(u.name)+'">'+esc(u.name)+'</span>';
}
function cardMark(d, big, live){
  return '<span class="pc'+(isRed(d)?' red':'')+(big?' big':'')+(live?' live':'')+'"><b>'+d+'</b><i>'+suitOf(d)+'</i></span>';
}

/* ============ state + storage ============ */
const freshState = () => ({
  tasks: DEFAULT_TASKS.slice(),
  flags: Object.assign({}, DEFAULT_FLAGS),
  currency: '\u20AA',
  users: DEFAULT_NAMES.map(n => ({id:uid(), name:n, day:1, doneDay:null, doneDate:null, active:true}))
});
let state = freshState();
let saveTimer = null, lastDay = gameDay(), tagEdit = false;

/* נשמר דרך אחסון האפליקציה כשהיא מוצגת בתוך Claude, ואחרת בזיכרון הדפדפן */
const store = {
  async get(k){
    let v = null;
    if (window.storage){ try { const r = await window.storage.get(k); v = r && r.value; } catch(e){} }
    if (!v){ try { v = localStorage.getItem(k); } catch(e){} }
    return v;
  },
  async set(k,v){
    let ok = false;
    if (window.storage){ try { await window.storage.set(k,v); ok = true; } catch(e){} }
    try { localStorage.setItem(k,v); ok = true; } catch(e){}
    return ok;
  }
};
async function load(){
  const raw = await store.get(KEY);
  if (!raw) return;
  try {
    const p = JSON.parse(raw);
    if (Array.isArray(p.tasks)){ state.tasks = p.tasks.slice(0,TOTAL); while(state.tasks.length<TOTAL) state.tasks.push(''); }
    if (Array.isArray(p.users)) state.users = p.users;
    state.flags = (p.flags && typeof p.flags === 'object') ? p.flags : Object.assign({}, DEFAULT_FLAGS);
    if (p.currency) state.currency = p.currency;
  } catch(e){ /* נתונים פגומים: נשארים עם ברירת המחדל */ }
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => store.set(KEY, JSON.stringify(state)), 200);
}

/* ============ daily rollover ============ */
function rollover(){
  const t = gameDay();
  state.users.forEach(u => { if (u.doneDate && u.doneDate < t && u.doneDay === u.day) u.day++; });
}

/* ============ render ============ */
function render(){
  rollover();
  const active = state.users.filter(u => u.active !== false);
  const paused = state.users.filter(u => u.active === false);
  const running = active.filter(u => !finished(u));
  const doneCount = running.filter(doneToday).length;
  const dateLabel = gameDayDate().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});
  const ms = msToSwitch(), hh = Math.floor(ms/3600000), mm = Math.floor(ms%3600000/60000);

  /* 1 · 30 המשימות */
  let list = '';
  for (let d=1; d<=TOTAL; d++){
    const here = running.filter(u => u.day === d);
    const toks = here.map(u => '<span class="tok'+(pale(chipOf(u))?' pale':'')+(doneToday(u)?' done':'')+
        '" style="background:'+chipOf(u)+'" data-act="flip" data-id="'+u.id+'" role="button" aria-label="'+esc(u.name)+'">'+esc(u.name)+'</span>').join('');
    const many = here.length > 1;
    const btns = here.map(u => '<button class="mini'+(doneToday(u)?' ok':'')+'" data-act="flip" data-id="'+u.id+'">'+
      (doneToday(u)?'<b>\u2713</b> ':'')+'בוצע'+(many?' '+esc(u.name):'')+'</button>').join('');
    list += '<li class="q-row'+(here.length?' live':'')+'">'+cardMark(d,false,here.length>0)+btns+
      '<input class="q-name" dir="auto" data-act="task" data-day="'+d+'" value="'+esc(state.tasks[d-1]||'')+'" placeholder="משימה '+d+'" aria-label="שם המשימה ליום '+d+'">'+
      badge(d, tagEdit)+'<span class="tokens">'+toks+'</span></li>';
  }
  const listPanel = '<div class="panel"><ol class="q">'+list+'</ol>'+
    '<div class="legend"><span>ז\'טון = חשבון שנמצא במשימה הזו</span><span>מסגרת זהב = בוצע היום</span>'+
    '<span class="badge hard">Hard</span><span class="badge no">Do Not Do</span></div></div>';

  /* 2 · היום */
  const byDay = {};
  running.forEach(u => (byDay[u.day] = byDay[u.day]||[]).push(u));
  const days = Object.keys(byDay).map(Number).sort((a,b)=>a-b);
  let todayHtml = '';
  if (!running.length){
    todayHtml = '<div class="empty">אין חשבונות פעילים. הוסיפו חשבון בקטע "החשבונות".</div>';
  } else {
    days.forEach(d => {
      const rows = byDay[d].map(u =>
        '<div class="p-row">'+token(u,doneToday(u)?' done':'')+'<span class="n">'+esc(u.name)+'</span>'+
        (doneToday(u) ? '<span class="ok">\u2713 בוצע</span><button class="ghost" data-act="undo" data-id="'+u.id+'">בטל</button>'
                      : '<button class="b-gold" data-act="done" data-id="'+u.id+'">סמן כבוצע</button>')+
        '</div>').join('');
      todayHtml += '<div class="card"><div class="head-row">'+cardMark(d,true,true)+
        '<span class="t" dir="auto">'+esc(taskName(d))+'</span>'+badge(d,false)+'</div>'+rows+'</div>';
    });
  }

  /* 3 · מחר */
  let tomorrow = '';
  if (running.length){
    const rows = running.map(u => {
      const nd = doneToday(u) ? u.day+1 : u.day;
      const over = nd > TOTAL;
      return '<tr><td>'+token(u)+'</td>'+
        '<td>'+(over ? '<span class="fin">סיום</span>' : cardMark(nd,false,false))+'</td>'+
        '<td dir="auto">'+(over ? 'כל 30 המשימות הושלמו' : esc(taskName(nd))+' '+badge(nd,false))+'</td>'+
        '<td>'+(doneToday(u) || over ? '' : '<span class="flag">אם המשימה של היום לא תושלם</span>')+'</td></tr>';
    }).join('');
    tomorrow = '<div class="panel pad"><table><thead><tr><th>חשבון</th><th>יום</th><th>המשימה</th><th></th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table></div>';
  } else {
    tomorrow = '<div class="empty">יופיע כאן ברגע שיהיו חשבונות פעילים.</div>';
  }

  /* 4 · החשבונות */
  const userCard = u => {
    const fin = finished(u), dn = doneToday(u);
    return '<div class="card'+(u.active===false?' paused':'')+'">'+
      '<div class="u-head">'+token(u,dn?' done':'')+
        '<input class="u-name" data-act="rename" data-id="'+u.id+'" value="'+esc(u.name)+'" aria-label="שם החשבון">'+
        (fin ? '<span class="fin">סיים 30 ימים</span>' : cardMark(u.day,false,true))+'</div>'+
      '<p class="u-task" dir="auto">'+(fin ? 'כל 30 המשימות הושלמו.' : esc(taskName(u.day))+' '+badge(u.day,false))+'</p>'+
      '<div class="u-act">'+
        (fin ? '' : (dn ? '<span class="ok">\u2713 בוצע היום</span><button class="b-out" data-act="undo" data-id="'+u.id+'">בטל</button>'
                        : '<button class="b-gold" data-act="done" data-id="'+u.id+'">סמן כבוצע</button>'))+
        '<span class="spacer"></span>'+
        (fin ? '' : '<button class="icon" data-act="minus" data-id="'+u.id+'" aria-label="יום אחורה">\u2212</button>'+
                    '<input class="dayin" type="number" min="1" max="'+TOTAL+'" inputmode="numeric" data-act="setday" data-id="'+u.id+'" value="'+u.day+'" aria-label="מספר היום">'+
                    '<button class="icon" data-act="plus" data-id="'+u.id+'" aria-label="יום קדימה">+</button>')+
        '<button class="ghost" data-act="toggle" data-id="'+u.id+'">'+(u.active===false?'הפעל':'השהה')+'</button>'+
        '<button class="ghost" data-act="del" data-id="'+u.id+'">מחק</button>'+
      '</div></div>';
  };
  const usersHtml =
    '<div class="add"><input id="newName" placeholder="שם חשבון חדש" aria-label="שם חשבון חדש" enterkeyhint="done">'+
    '<button class="b-gold" data-act="add">הוסף</button></div>'+
    (active.length ? active.map(userCard).join('') : '<div class="empty">אין חשבונות פעילים.</div>')+
    (paused.length ? '<h2 style="font-size:16px"><span class="s">\u2663</span>מושהים</h2>'+paused.map(userCard).join('') : '');

  /* 5 · כספים */
  const cur = state.currency;
  const mRows = state.users.map(u =>
    '<div class="m-row">'+token(u)+'<span class="n">'+esc(u.name)+'</span>'+
    '<span class="m-cur">'+esc(cur)+'</span>'+
    '<input class="m-in" type="number" inputmode="decimal" step="any" min="0" data-act="money" data-id="'+u.id+'" '+
    'value="'+(u.money==null?'':u.money)+'" placeholder="0" aria-label="סכום שהופקד"></div>').join('');
  const mSum = state.users.reduce((a,u) => a + (Number(u.money)||0), 0);
  const moneyHtml = state.users.length
    ? '<div class="panel pad">'+mRows+'<div class="m-total"><span>סך הכל</span>'+
      '<span class="v">'+esc(cur)+' <span id="mtotal">'+mSum.toLocaleString('he-IL')+'</span></span></div></div>'
    : '<div class="empty">אין חשבונות להזין להם סכומים.</div>';

  document.getElementById('app').innerHTML =
    '<header><p class="suits">\u2660 \u2665 \u2666 \u2663</p><h1>7XL Tracker</h1>'+
    '<div class="meta"><span>'+esc(dateLabel)+'</span>'+
      (running.length ? '<span class="plaque">'+doneCount+'/'+running.length+' בוצעו היום</span>' : '')+
      '<span id="cd">המשימות מתחלפות ב-03:00 \u00B7 בעוד '+hh+'ש '+mm+'ד</span></div></header>'+
    '<div class="rail"></div>'+
    '<h2><span class="s">\u2660</span>30 המשימות</h2>'+
    '<p class="hint">אפשר ללחוץ על כל שם משימה ולערוך אותו. '+
      '<button class="ghost cream" data-act="tagmode">'+(tagEdit?'סיום עריכת תגיות':'עריכת תגיות')+'</button></p>'+ listPanel +
    '<h2><span class="s r">\u2665</span>המשימות של היום</h2>'+ todayHtml +
    '<h2><span class="s r">\u2666</span>המשימות של מחר</h2>'+ tomorrow +
    '<h2><span class="s">\u2663</span>החשבונות</h2>'+ usersHtml +
    '<h2><span class="s">'+esc(state.currency)+'</span>כמה הפקדתי לכל חשבון'+
      '<button class="ghost cream" data-act="cur" style="flex:none">שינוי מטבע</button></h2>'+ moneyHtml +
    '<footer><span>הנתונים נשמרים אוטומטית בדפדפן הזה.</span>'+
      '<button class="ghost cream" data-act="backup">גיבוי</button>'+
      '<button class="ghost cream" data-act="restore">שחזור</button>'+
      '<button class="ghost cream" data-act="reset">אפס הכל</button></footer>';
}

/* ============ actions ============ */
const byId = id => state.users.find(u => u.id === id);

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName === 'INPUT') return;
  const act = b.dataset.act, u = byId(b.dataset.id);

  if (act === 'add'){
    const i = document.getElementById('newName'), name = (i.value||'').trim();
    if (!name){ i.focus(); return; }
    state.users.push({id:uid(), name, day:1, doneDay:null, doneDate:null, active:true});
  }
  else if (act === 'flip' && u){ if (doneToday(u)){ u.doneDay=null; u.doneDate=null; } else { u.doneDay=u.day; u.doneDate=gameDay(); } }
  else if (act === 'done' && u){ u.doneDay = u.day; u.doneDate = gameDay(); }
  else if (act === 'undo' && u){ u.doneDay = null; u.doneDate = null; }
  else if (act === 'plus'  && u){ u.day = Math.min(TOTAL+1, u.day+1); u.doneDay = null; u.doneDate = null; }
  else if (act === 'minus' && u){ u.day = Math.max(1, u.day-1); u.doneDay = null; u.doneDate = null; }
  else if (act === 'toggle'&& u){ u.active = u.active === false; }
  else if (act === 'del'   && u){
    if (!confirm('למחוק את "'+u.name+'"?')) return;
    state.users = state.users.filter(x => x.id !== u.id);
  }
  else if (act === 'cur'){
    const list = ['\u20AA','$','\u20AC'];
    state.currency = list[(list.indexOf(state.currency)+1) % list.length];
  }
  else if (act === 'tagmode'){ tagEdit = !tagEdit; render(); return; }
  else if (act === 'flag'){
    const d = b.dataset.day, cur = flagOf(d);
    if (!state.flags) state.flags = {};
    if (cur === 'hard') state.flags[d] = 'no';
    else if (cur === 'no') delete state.flags[d];
    else state.flags[d] = 'hard';
  }
  else if (act === 'backup'){
    prompt('העתיקו את הטקסט הזה ושמרו אותו. אפשר להדביק אותו ב"שחזור" בכל מכשיר אחר.', JSON.stringify(state));
    return;
  }
  else if (act === 'restore'){
    const txt = prompt('הדביקו כאן טקסט גיבוי:');
    if (!txt) return;
    try {
      const p = JSON.parse(txt);
      if (!Array.isArray(p.tasks) || !Array.isArray(p.users)) throw 0;
      state = p;
    } catch(err){ alert('הטקסט אינו גיבוי תקין.'); return; }
  }
  else if (act === 'reset'){
    if (!confirm('להחזיר את כל החשבונות ליום 1 ואת שמות המשימות למקור?')) return;
    state = freshState();
  }
  else return;

  save(); render();
});

/* עריכת שמות משימות: שומר בלי לרנדר מחדש כדי לא לסגור את המקלדת */
document.addEventListener('input', e => {
  const el = e.target;
  if (!el.dataset) return;
  if (el.dataset.act === 'task'){ state.tasks[Number(el.dataset.day)-1] = el.value; save(); }
  if (el.dataset.act === 'money'){
    const u = byId(el.dataset.id);
    if (u){
      u.money = el.value === '' ? null : Number(el.value);
      save();
      const t = document.getElementById('mtotal');
      if (t) t.textContent = state.users.reduce((a,x) => a + (Number(x.money)||0), 0).toLocaleString('he-IL');
    }
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.act === 'rename'){
    const u = byId(el.dataset.id);
    if (u){ u.name = (el.value||'').trim() || u.name; save(); render(); }
  }
  if (el.dataset && el.dataset.act === 'setday'){
    const u = byId(el.dataset.id);
    if (u){
      let n = parseInt(el.value, 10);
      if (isNaN(n)) n = u.day;
      u.day = Math.min(TOTAL, Math.max(1, n));
      u.doneDay = null; u.doneDate = null;
      save(); render();
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'newName'){ e.preventDefault(); document.querySelector('[data-act="add"]').click(); }
  if (e.key === 'Enter' && e.target.dataset && ['task','setday','money'].indexOf(e.target.dataset.act) > -1) e.target.blur();
});

/* שעון: מעדכן את הספירה לאחור, ומרנדר מחדש כשעובר 03:00 */
setInterval(() => {
  if (gameDay() !== lastDay){ lastDay = gameDay(); render(); return; }
  const cd = document.getElementById('cd');
  if (cd){ const ms = msToSwitch(); cd.textContent = 'המשימות מתחלפות ב-03:00 \u00B7 בעוד '+Math.floor(ms/3600000)+'ש '+Math.floor(ms%3600000/60000)+'ד'; }
}, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden){ lastDay = gameDay(); render(); } });

load().then(render);
</script>
