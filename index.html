const store = {
  async get(k){
    let v = null;
    if (window.storage){ try { const r = await window.storage.get(k); v = r && r.value; } catch(e){} }
    if (!v){ try { v = localStorage.getItem(k); } catch(e){} }
    return v;
  },
  async set(k,v){
    let ok = false;
    if (window.storage){ try { await window.storage.set(k,v); ok = true; } catch(e){} }
    try { localStorage.setItem(k,v); ok = true; } catch(e){}
    return ok;
  }
};
async function load(){
  const raw = await store.get(KEY);
  if (!raw) return;
  try {
    const p = JSON.parse(raw);
    if (Array.isArray(p.tasks)){ state.tasks = p.tasks.slice(0,TOTAL); while(state.tasks.length<TOTAL) state.tasks.push(''); }
    state.taskVer = p.taskVer || 0;
    if (state.taskVer < TASK_VERSION){
      state.tasks = DEFAULT_TASKS.slice();      /* איפוס מלא לרשימה שאני מכיר */
      state.taskVer = TASK_VERSION;
    } else {
      /* משימות שידועות לי ועוד לא מולאו במכשיר, נכנסות לבד */
      for (let i = 0; i < TOTAL; i++){
        if (!String(state.tasks[i]||'').trim() && KNOWN_TASKS[i+1]) state.tasks[i] = KNOWN_TASKS[i+1];
      }
    }
    /* ניקוי חד פעמי של ימים שנרשמו בטעות */
    state.taskFix = p.taskFix || 0;
    if (state.taskFix < TASK_FIX_VERSION){
      CLEAR_DAYS.forEach(d => { state.tasks[d-1] = KNOWN_TASKS[d] || ''; });
      state.taskFix = TASK_FIX_VERSION;
    }
    if (Array.isArray(p.users)) state.users = p.users;
    /* חשבון שעדיין אין לו מונה השלמות, מקבל אותו מלא לפי היום הנוכחי שלו */
    state.users.forEach(u => { if (typeof u.completed !== 'number') u.completed = u.day || 0; });
    state.flags = (p.flags && typeof p.flags === 'object') ? p.flags : Object.assign({}, DEFAULT_FLAGS);
    /* פעם אחת: כל יום בלי תגית מקבל Easy, בלי לגעת במה שסימנת */
    state.flagVer = p.flagVer || 0;
    if (state.flagVer < FLAG_VERSION){
      state.flags = Object.assign({}, DEFAULT_FLAGS);
      state.flagVer = FLAG_VERSION;
    }
    state.currency = '$';
    state.archive = Array.isArray(p.archive) ? p.archive : [];
    state.tickets = Array.isArray(p.tickets) ? p.tickets : [];
    state.msVer = p.msVer || 1;
    state.milestones = (Array.isArray(p.milestones) && p.milestones.length && state.msVer >= MILESTONE_VERSION)
      ? p.milestones
      : DEFAULT_MILESTONES.map(m => ({ id: uid(), n: m.n, text: m.text }));
    state.msVer = MILESTONE_VERSION;
    state.folded = (p.folded && typeof p.folded === 'object') ? p.folded : { archive: true };
  } catch(e){ /* נתונים פגומים: נשארים עם ברירת המחדל */ }
}

/* ============ daily rollover ============ */
function dayDiff(a, b){
  const pa = a.split('-').map(Number), pb = b.split('-').map(Number);
  return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2]) - Date.UTC(pa[0],pa[1]-1,pa[2])) / 86400000);
}
function rollover(){
  const t = gameDay();
  state.users.forEach(u => {
    if (!u.dayDate){ u.dayDate = t; return; }
    if (u.dayDate < t){
      let diff = dayDiff(u.dayDate, t);
      /* חשבון חדש מקבל יום חינם: המעבר הראשון בין ימים לא מקדם אותו */
      if (u.grace){ diff = Math.max(0, diff - 1); u.grace = false; }
      u.day = Math.min(TOTAL + 1, u.day + diff);
      u.dayDate = t;
      u.doneDay = null; u.doneDate = null;
    }
  });
}

      ((!String(u.email||'').trim() || mailEdit[u.id])
        ? '<div class="u-mail-row"><input class="mail-in u-mail" type="email" autocapitalize="off" spellcheck="false" '+
            'data-act="u-mail" data-id="'+u.id+'" value="'+esc(u.email||'')+'" placeholder="email" aria-label="אימייל של החשבון">'+
          '<button class="mini sm" data-act="u-mail-done" data-id="'+u.id+'">הוסף אימייל</button></div>'
        : '')+
      '<div class="u-act">'+
        (fin ? '' : '<button class="mini'+(dn?' ok':'')+'" data-act="flip" data-id="'+u.id+'">'+
          (dn?'<b>\u2713</b> Done':'To Do')+'</button>')+
        '<span class="spacer"></span>'+
        (fin ? '' : '<button class="icon" data-act="minus" data-id="'+u.id+'" aria-label="יום אחורה">\u2212</button>'+
                    '<input class="dayin" type="number" min="1" max="'+TOTAL+'" inputmode="numeric" data-act="setday" data-id="'+u.id+'" value="'+u.day+'" aria-label="מספר היום">'+
                    '<button class="icon" data-act="plus" data-id="'+u.id+'" aria-label="יום קדימה">+</button>')+
        '<button class="ghost" data-act="toggle" data-id="'+u.id+'">'+(u.active===false?'הפעל':'השהה')+'</button>'+
        '<button class="ghost" data-act="archive" data-id="'+u.id+'">לארכיון</button>'+
        '<button class="ghost" data-act="del" data-id="'+u.id+'">מחק</button>'+
      '</div></div>';
  };
  const usersHtml =
    '<div class="add"><input id="newName" placeholder="שם חשבון חדש" aria-label="שם חשבון חדש" enterkeyhint="done">'+
    '<button class="b-gold" data-act="add">הוסף</button></div>'+
    (active.length ? active.map(userCard).join('') : '<div class="empty">אין חשבונות פעילים.</div>')+
    (paused.length ? '<h2 style="font-size:16px"><span class="s">\u2663</span>מושהים</h2>'+paused.map(userCard).join('') : '');

  /* 5 · Finance */
  const cur = state.currency;
  const num = v => (v==null||v==='') ? '' : v;
  const fRows = state.users.map(u => {
    const pl = (Number(u.balance)||0) - (Number(u.money)||0);
    return '<tr><td><span class="nm">'+token(u)+esc(u.name)+'</span></td>'+
      '<td><input class="fin-in" type="number" inputmode="decimal" step="any" data-act="money" data-id="'+u.id+'" value="'+num(u.money)+'" placeholder="0" aria-label="Deposited"></td>'+
      '<td><input class="fin-in" type="number" inputmode="decimal" step="any" data-act="bal" data-id="'+u.id+'" value="'+num(u.balance)+'" placeholder="0" aria-label="Current"></td>'+
      '<td><span class="pl'+(pl>0?' pos':(pl<0?' neg':''))+'" id="pl-'+u.id+'">'+(pl>0?'+':'')+pl.toLocaleString('he-IL')+'</span></td></tr>';
  }).join('');
  const tDep = state.users.reduce((a,u) => a + (Number(u.money)||0), 0);
  const tCur = state.users.reduce((a,u) => a + (Number(u.balance)||0), 0);
  const tPl = tCur - tDep;
  const moneyHtml = state.users.length
    ? '<div class="panel pad"><table class="ftab"><thead><tr><th>Account</th><th>Deposited</th><th>Current</th><th>Profit</th></tr></thead>'+
      '<tbody>'+fRows+'</tbody>'+
      '<tfoot><tr><td class="lbl">Total</td>'+
      '<td><span class="fin-tot">'+esc(cur)+' <span id="ftot-dep">'+tDep.toLocaleString('he-IL')+'</span></span></td>'+
      '<td><span class="fin-tot">'+esc(cur)+' <span id="ftot-cur">'+tCur.toLocaleString('he-IL')+'</span></span></td>'+
      '<td class="pl'+(tPl>0?' pos':(tPl<0?' neg':''))+'" id="ftot-pl-cell">'+(tPl>0?'+':'')+tPl.toLocaleString('he-IL')+'</td>'+
      '</tr></tfoot></table></div>'
    : '<div class="empty">אין חשבונות פעילים להזין להם סכומים.</div>';

  /* 6 · Archive */
  const aRows = (state.archive||[]).map(a =>
    '<tr><td><span class="nm">'+esc(a.name)+'</span></td>'+
    '<td><input class="mail-in" type="email" autocapitalize="off" spellcheck="false" data-act="a-mail" data-id="'+a.id+'" value="'+esc(a.email||'')+'" placeholder="email" aria-label="Email"></td>'+
    '<td><input class="fin-in" type="number" inputmode="decimal" step="any" data-act="a-dep" data-id="'+a.id+'" value="'+num(a.deposited)+'" placeholder="0" aria-label="Deposited"></td>'+
    '<td><input class="fin-in" type="number" inputmode="decimal" step="any" data-act="a-prof" data-id="'+a.id+'" value="'+num(a.profit)+'" placeholder="0" aria-label="Ended with"></td>'+
    '<td><button class="ghost" data-act="a-back" data-id="'+a.id+'">החזר</button></td></tr>').join('');
  const archHtml = (state.archive||[]).length
    ? '<div class="panel pad"><table class="ftab"><thead><tr><th>Account</th><th>Email</th><th>Deposited</th><th>Ended with</th><th></th></tr></thead>'+
      '<tbody>'+aRows+'</tbody></table></div>'
    : '<div class="empty">הארכיון ריק. חשבון שסיים עובר לכאן מכרטיס החשבון.</div>';

  document.getElementById('app').innerHTML =
    '<header><p class="suits">\u2660 \u2665 \u2666 \u2663</p><h1>7XL Tracker</h1>'+
    '<div class="meta"><span>'+esc(dateLabel)+'</span>'+
      (running.length ? '<span class="plaque">'+doneCount+'/'+running.length+' בוצעו היום</span>' : '')+
      '<span id="cd">המשימות מתחלפות ב-03:00 \u00B7 בעוד '+hh+'ש '+mm+'ד</span></div></header>'+
    '<div class="rail"></div>'+
    H('tasks','\u2660','30 המשימות')+
    (isFolded('tasks') ? '' :
      '<p class="hint">אפשר ללחוץ על כל שם משימה ולערוך אותו. '+
      '<button class="ghost cream" data-act="tagmode">'+(tagEdit?'סיום עריכת תגיות':'עריכת תגיות')+'</button>'+
      '<button class="ghost cream" data-act="clear-tasks">נקה שמות ותגיות</button></p>'+ listPanel)+
    H('today','\u2665','היום ומחר',1)+ (isFolded('today') ? '' : todayHtml)+
    H('accounts','\u2663','החשבונות')+ (isFolded('accounts') ? '' : usersHtml)+
    H('finance', esc(state.currency), 'Finance')+
      (isFolded('finance') ? '' : moneyHtml)+
    H('archive','\u2663','Archive ('+(state.archive||[]).length+')')+
      (isFolded('archive') ? '' : archHtml)+
    '<footer><span>גרסה '+BUILD+' \u00B7 הנתונים נשמרים בדפדפן הזה.'+
      (state.lastBackup ? ' גיבוי אחרון: '+esc(state.lastBackup)+'.' : ' עוד לא גיבית.')+'</span>'+
      '<button class="ghost cream" data-act="backup">גיבוי</button>'+
      '<button class="ghost cream" data-act="restore">שחזור</button>'+
      '<button class="ghost cream" data-act="reset">אפס הכל</button></footer>';
}

function updateFin(){
  state.users.forEach(u => {
    const el = document.getElementById('pl-'+u.id);
    if (!el) return;
    const v = (Number(u.balance)||0) - (Number(u.money)||0);
    el.textContent = (v>0?'+':'') + v.toLocaleString('he-IL');
    el.className = 'pl' + (v>0?' pos':(v<0?' neg':''));
  });
  const d = state.users.reduce((a,u) => a + (Number(u.money)||0), 0);
  const c = state.users.reduce((a,u) => a + (Number(u.balance)||0), 0);
  const put = (id,v) => { const e = document.getElementById(id); if (e) e.textContent = v.toLocaleString('he-IL'); };
  put('ftot-dep', d); put('ftot-cur', c); put('ftot-pl', c-d);
}


/* ============ actions ============ */
const byId = id => state.users.find(u => u.id === id);

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName === 'INPUT') return;
  const act = b.dataset.act, u = byId(b.dataset.id);

  if (act === 'add'){
    const i = document.getElementById('newName'), name = (i.value||'').trim();
    if (!name){ i.focus(); return; }
    state.users.push({id:uid(), name, day:1, doneDay:null, doneDate:null, active:true, dayDate:gameDay(), completed:0, grace:true});
  }
  else if (act === 'flip' && u){
    if (doneToday(u)){ u.doneDay=null; u.doneDate=null; u.completed = Math.max(0,(u.completed||0)-1); }
    else { u.doneDay=u.day; u.doneDate=gameDay(); u.completed = (u.completed||0)+1; }
  }
  else if (act === 'done' && u){ if (!doneToday(u)) u.completed = (u.completed||0)+1; u.doneDay = u.day; u.doneDate = gameDay(); }
  else if (act === 'undo' && u){ if (doneToday(u)) u.completed = Math.max(0,(u.completed||0)-1); u.doneDay = null; u.doneDate = null; }
  else if (act === 'prog-set' ){ /* handled as an input event below */ }
  else if (act === 'plus'  && u){ u.day = Math.min(TOTAL+1, u.day+1); u.doneDay = null; u.doneDate = null; u.dayDate = gameDay(); }
  else if (act === 'minus' && u){ u.day = Math.max(1, u.day-1); u.doneDay = null; u.doneDate = null; u.dayDate = gameDay(); }
  else if (act === 'toggle'&& u){ u.active = u.active === false; }
  else if (act === 'del'   && u){
    if (!confirm('למחוק את "'+u.name+'"?')) return;
    state.users = state.users.filter(x => x.id !== u.id);
  }
  else if (act === 'pz-more'){ pzOpen[b.dataset.id] = !pzOpen[b.dataset.id]; render(); return; }
  else if (act === 'pz' && u){
    const n = Number(b.dataset.n);
    const txt = Object.keys(pmap).map(d => pmap[d]).filter(x => x.n === n).map(x => x.text)[0] || '';
    u.used = u.used || [];
    const at = u.used.findIndex(x => (x && typeof x === 'object') ? (x.n === n && x.t === txt) : x === n);
    if (at > -1) u.used.splice(at, 1); else u.used.push({ n: n, t: txt });
  }
  else if (act === 'u-mail-done' && u){
    if (!String(u.email||'').trim()) return;
    delete mailEdit[u.id];
  }
  else if (act === 'u-mail-edit' && u){ mailEdit[u.id] = true; }
  else if (act === 'archive' && u){
    if (!confirm('להעביר את "'+u.name+'" לארכיון?')) return;
    const ask = prompt('כמה כסף היה בחשבון בסיום?', u.balance == null ? '' : String(u.balance));
    if (ask === null) return;   /* ביטול */
    const askNum = Number(String(ask).trim());
    const ended = String(ask).trim() === '' ? null : (isNaN(askNum) ? (u.balance==null?null:u.balance) : askNum);
    state.archive = state.archive || [];
    state.archive.push({ id: uid(), name: u.name, email: u.email || '', deposited: u.money==null?null:u.money,
      profit: ended, notes: u.notes || '', day: u.day, completed: u.completed || 0 });
    state.users = state.users.filter(x => x.id !== u.id);
    state.folded = state.folded || {}; state.folded.archive = false;
  }
  else if (act === 'a-back'){
    const a = (state.archive||[]).find(x => x.id === b.dataset.id);
    if (!a) return;
    state.users.push({ id: uid(), name: a.name, day: Math.min(TOTAL, Math.max(1, a.day||1)),
      doneDay: null, doneDate: null, active: true, money: a.deposited, balance: null,
      email: a.email || '', notes: a.notes || '', dayDate: gameDay(), completed: a.completed || 0, grace: false });
    state.archive = state.archive.filter(x => x.id !== a.id);
  }
  else if (act === 'clear-tasks'){
    if (!confirm('לנקות את כל שמות המשימות ואת כל התגיות?')) return;
    state.tasks = Array(TOTAL).fill('');
    state.flags = Object.assign({}, DEFAULT_FLAGS);
  }
  else if (act === 'fold'){
    const sec = b.dataset.sec;
    state.folded = state.folded || {};
    state.folded[sec] = !state.folded[sec];
    save(); render(); return;
  }
  else if (act === 'tagmode'){ tagEdit = !tagEdit; render(); return; }
  else if (act === 'flag'){
    const d = b.dataset.day, cur = flagOf(d);
    if (!state.flags) state.flags = {};
    if (cur === 'hard') state.flags[d] = 'easy';
    else if (cur === 'easy') state.flags[d] = 'no';
    else if (cur === 'no') delete state.flags[d];
    else state.flags[d] = 'hard';
  }
  else if (act === 'backup'){
    try {
      const blob = new Blob([JSON.stringify(state, null, 1)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '7XL-backup-' + gameDay() + '.json';
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      state.lastBackup = gameDay(); save(); render();
    } catch(e){ prompt('העתיקו את הטקסט ושמרו אותו:', JSON.stringify(state)); }
    return;
  }
  else if (act === 'restore'){
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'application/json,.json';
    inp.addEventListener('change', () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const q = JSON.parse(String(rd.result));
          if (!Array.isArray(q.tasks) || !Array.isArray(q.users)) throw 0;
          if (!confirm('לשחזר את הגיבוי? הנתונים הקיימים במכשיר יוחלפו.')) return;
          state = q; save(); render();
        } catch(err){ alert('הקובץ אינו גיבוי תקין.'); }
      };
      rd.readAsText(f);
    });
    inp.click();
    return;
  }
  else if (act === 'reset'){
    if (!confirm('להחזיר את כל החשבונות ליום 1 ואת שמות המשימות למקור?')) return;
    state = freshState();
  }
  else return;

  save(); render();
});

/* עריכת שמות משימות: שומר בלי לרנדר מחדש כדי לא לסגור את המקלדת */
document.addEventListener('input', e => {
  const el = e.target;
  if (!el.dataset) return;
  if (el.dataset.act === 'task'){
    state.tasks[Number(el.dataset.day)-1] = el.value;
    save();
    if (el.closest){
      const row = el.closest('.q-row');
      if (row) row.classList.toggle('unknown', !el.value.trim());
    }
  }
  if (el.dataset.act === 'u-note'){
    const u = byId(el.dataset.id);
    if (u){ u.notes = el.value; save(); }
  }
  if (el.dataset.act === 'prog-set'){
    const u = byId(el.dataset.id);
    if (u){ u.completed = Math.max(0, Math.min(TOTAL, Number(el.value) || 0)); save(); }
  }
  if (el.dataset.act === 'u-mail'){
    const u = byId(el.dataset.id);
    if (u){ u.email = el.value; save(); }
  }
  if (el.dataset.act === 'money' || el.dataset.act === 'bal'){
    const u = byId(el.dataset.id);
    if (u){
      const v = el.value === '' ? null : Number(el.value);
      if (el.dataset.act === 'money') u.money = v; else u.balance = v;
      save(); updateFin();
    }
  }
  if (el.dataset.act === 'a-mail' || el.dataset.act === 'a-dep' || el.dataset.act === 'a-prof'){
    const a = (state.archive||[]).find(x => x.id === el.dataset.id);
    if (a){
      if (el.dataset.act === 'a-mail') a.email = el.value;
      else if (el.dataset.act === 'a-dep') a.deposited = el.value === '' ? null : Number(el.value);
      else a.profit = el.value === '' ? null : Number(el.value);
      save();
    }
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.act === 'rename'){
    const u = byId(el.dataset.id);
    if (u){ u.name = (el.value||'').trim() || u.name; save(); render(); }
  }
  if (el.dataset && el.dataset.act === 'setday'){
    const u = byId(el.dataset.id);
    if (u){
      let n = parseInt(el.value, 10);
      if (isNaN(n)) n = u.day;
      u.day = Math.min(TOTAL, Math.max(1, n));
      u.doneDay = null; u.doneDate = null; u.dayDate = gameDay();
      save(); render();
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'newName'){ e.preventDefault(); document.querySelector('[data-act="add"]').click(); }
  if (e.key === 'Enter' && e.target.dataset && ['task','setday','money','bal','a-dep','a-prof','a-mail'].indexOf(e.target.dataset.act) > -1) e.target.blur();
});

/* שעון: מעדכן את הספירה לאחור, ומרנדר מחדש כשעובר 03:00 */
setInterval(() => {
  if (gameDay() !== lastDay){ lastDay = gameDay(); render(); return; }
  const cd = document.getElementById('cd');
  if (cd){ const ms = msToSwitch(); cd.textContent = 'המשימות מתחלפות ב-'+switchClock()+' \u00B7 בעוד '+Math.floor(ms/3600000)+'ש '+Math.floor(ms%3600000/60000)+'ד'; }
}, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden){ lastDay = gameDay(); render(); } });

async function checkUpdate(){
  try {
    const r = await fetch('version.json?cb=' + Date.now(), { cache: 'no-store' });
    const j = await r.json();
    if (!j || !j.build || j.build === BUILD || document.querySelector('.upbar')) return;
    const bar = document.createElement('div');
    bar.className = 'upbar';
    bar.innerHTML = '<span>גרסה חדשה זמינה: ' + esc(j.build) + '</span><button type="button">רענן</button>';
    bar.querySelector('button').addEventListener('click', () => {
      location.replace(location.pathname + '?v=' + encodeURIComponent(j.build) + '&t=' + Date.now());
    });
    document.body.appendChild(bar);
  } catch(e){ /* אין רשת, לא נורא */ }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });

load().then(render).then(checkUpdate);
</script>
